name: Deploy prod
# Deploy till produktionsservern efter grön CI på main (eller för hand).
#
# Jobbet checkar inte ut något: ett ssh-anrop, och servern gör resten med
# tooling/scripts/deploy-prod.sh (fast-forward till origin/main, backup, bygge
# i docker, migrationer, /readyz, atomärt klientbyte). Nyckeln i serverns
# authorized_keys är låst till just det kommandot (restrict,command=…), så
# den kan inte användas till något annat — rollback är fortsatt manuell.
# Se docs/deploy-server-first.md (Deploy från CI).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Aldrig två deployer samtidigt; en pågående avbryts inte (skriptet vägrar
# ändå om ett annat bygge kör, men vi slipper en halv körning).
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy till prod
    # workflow_run körs också när CI föll — då stannar vi här.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Miljön bär secrets och grinden (obligatorisk granskare) — se docs.
    environment: production
    steps:
      - name: ssh-nyckel och serverns värdnyckel
        env:
          SSH_KEY: ${{ secrets.AVA_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.AVA_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
      - name: deploy-prod.sh på servern
        env:
          DEPLOY_HOST: ${{ secrets.AVA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.AVA_DEPLOY_USER || 'root' }}
        # Kommandot avgörs av serverns authorized_keys (restrict,command=…),
        # inte av vad som skickas här. Exit-koden är skriptets.
        run: ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" deploy
