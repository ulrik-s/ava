name: Helper UI CI

# Typecheck + test för helper-ui (Electron-tray-app med in-process-motor,
# ADR 0029/0030) vid varje PR som rör dess kod. Täcker de Electron-fria
# logik-modulerna + motorn (src/engine/); interaktiv tray/login + paketering
# (electron-builder) verifieras på mål-datorn.
on:
  push:
    branches: [main]
    paths:
      - "helper-ui/**"
      - "src/lib/shared/**"
      - "src/lib/server/routers/**" # helpern type-beror på AppRouter (ADR 0031)
      - ".github/workflows/helper-ui-ci.yml"
      - ".github/actions/bun-setup/**" # delad toolchain-setup (#909)
  pull_request:
    paths:
      - "helper-ui/**"
      - "src/lib/shared/**"
      - "src/lib/server/routers/**" # helpern type-beror på AppRouter (ADR 0031)
      - ".github/workflows/helper-ui-ci.yml"
      - ".github/actions/bun-setup/**" # delad toolchain-setup (#909)

# Least-privilege (#909): jobbet läser bara koden.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helper-ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # DRY toolchain (Node 24 + pinnad Bun + cachead frozen install), #909.
      # Composite-stegen kör i repo-roten (ärver inte job-defaultens
      # working-directory) → installerar ROOT-deps, vilket krävs för att typkolla
      # den tunna tRPC-klienten: `AppRouter` (type-only, ADR 0031) drar in
      # serverns typ-graf (zod, jose, @trpc/server …) från repo-rotens
      # node_modules; tsc i helper-ui resolver uppåt dit.
      - uses: ./.github/actions/bun-setup

      - name: Install (helper-ui)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test + coverage-grind
        # bunfig.toml: coverage=true + coverageThreshold (ratchet).
        run: bun test

      - name: Bundle (smoke)
        # Verifierar att Electron-main:en buntlar rent (alias/.ts/imports löser).
        # Paketering (electron-builder → .app/.exe) körs i release, ej här.
        run: bun run bundle
