name: Fortnox E2E

# E2E mot RIKTIGA Fortnox Voucher API (#1030, #1035).
#
# ## Varför den kan köras automatiskt
#
# En tidigare version av den här kommentaren påstod att verifikaten "INTE går
# att ta tillbaka". Det gäller API:t — det har varken DELETE eller PUT för
# verifikat — men inte kontot: i GUI:t går det ALLTID att ta bort det sista
# verifikatet i en serie, och ett räkenskapsår som bara innehåller manuella
# verifikat kan raderas i sin helhet.
#
# Därför bokför CI i en EGEN verifikatserie (AVA_FORTNOX_VOUCHER_SERIES) och ett
# EGET räkenskapsår (AVA_FORTNOX_BOOKING_WINDOW). Verifikaten blir städbara, och
# `withBookingWindow` avvisar allt daterat utanför fönstret innan det når nätet.
# Se docs/fortnox-e2e.md för hur bokföringen töms.
#
# ## Varför inte på PR-commits
#
# Två skäl, båda oberoende av städbarheten: secrets når inte fork-PR:er (varje
# extern PR hade blivit röd på något bidragsgivaren inte rår över), och
# `concurrency` nedan hade serialiserat hela PR-matrisen bakom en enda
# Fortnox-körning. `push: main` + nattlig schedule ger samma täckning utan
# den kostnaden.
#
# ## Roterande refresh-token — läs det här innan du felsöker
#
# Fortnox ogiltigförklarar den gamla refresh-token:en vid VARJE refresh. Ett
# token i en secret räcker därför till EN körning om vi inte skriver tillbaka
# det nya. Jobbet gör det (steget "Spara roterad refresh-token"), och det körs
# med `if: always()` eftersom token:en roterar redan i första anropet — även om
# verifikat-pushen senare fallerar är den gamla token:en död.
#
# Går write-back:en fel måste du göra om consent-rundan manuellt:
#   1. bun -e 'console.log(buildAuthorizeUrl(config, "state"))' → öppna i browser
#   2. godkänn → kopiera ?code= ur redirecten
#   3. exchangeCodeForTokens(config, code) → spara refresh_token i secreten
# Se src/lib/server/integrations/fortnox/README.md och docs/fortnox-e2e.md.

on:
  push:
    branches: [main]
    # Bara när Fortnox-vägen faktiskt ändrats — en docs-commit behöver inte
    # bränna verifikatnummer.
    paths:
      - "src/lib/server/integrations/fortnox/**"
      - "src/lib/server/integrations/ledger/**"
      - "src/lib/shared/accounting/**"
      - "tooling/scripts/fortnox-*.ts"
      - ".github/workflows/fortnox-e2e.yml"
  schedule:
    # 04:17 UTC — udda minut så den inte krockar med timslagets rusning.
    # Fångar att anslutningen dött (roterad token, indraget samtycke) innan
    # någon behöver den skarpt.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Bara auth + anslutningskoll (skapar INGET verifikat)"
        type: boolean
        default: false
      bookkeeping:
        description: "Bokför ett täckningsärendes BÅDA fakturor (klient + betalare) och verifiera kontona"
        type: boolean
        default: false

permissions:
  contents: read

# Aldrig två samtidiga körningar: de skulle refresha parallellt och slå ut
# varandras tokens (den ena rotationen ogiltigförklarar den andras).
concurrency:
  group: fortnox-e2e
  cancel-in-progress: false

jobs:
  fortnox-e2e:
    name: Fortnox E2E (sandbox)
    # Avstängningsknapp utan att redigera workflowen: sätt repo-variabeln till
    # något annat än "true" så hoppas jobbet över. Behövs t.ex. när samtycket
    # gått ut och ingen hunnit förnya det — annars hade main blivit röd på något
    # som inte är ett kodfel.
    #
    # Den MÅSTE ligga på REPO-nivå (`gh variable set`), inte på miljön: ett
    # job-`if` utvärderas innan `environment:` resolvas, så en
    # environment-variabel är alltid tom här och jobbet hade aldrig kört.
    if: vars.AVA_FORTNOX_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: fortnox-sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/bun-setup

      # Automatiska körningar (push/schedule) kör HELA vägen — det är poängen med
      # att flytta in flödet i CI. Bara ett manuellt dispatch kan välja bort
      # bokföringen (dry_run) eller nöja sig med syntet-fakturan. `inputs.*` är
      # tomma på andra event än dispatch, därför normaliseras de här i st.f. i
      # varje steg-villkor.
      - name: Avgör körläge
        id: mode
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_BOOK: ${{ inputs.bookkeeping }}
        run: |
          if [ "$DISPATCH" = "true" ]; then
            echo "dry_run=$IN_DRY"     >> "$GITHUB_OUTPUT"
            echo "bookkeeping=$IN_BOOK" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false"      >> "$GITHUB_OUTPUT"
            echo "bookkeeping=true"   >> "$GITHUB_OUTPUT"
          fi

      # Bokförings-testet behöver en körande AVA-stack: det skapar ett riktigt
      # täckningsärende med två betalande och bokför BÅDA fakturorna.
      - name: Starta server-first-stacken (bara bokföringsläget)
        if: steps.mode.outputs.bookkeeping == 'true' && steps.mode.outputs.dry_run != 'true'
        run: |
          bun run server-first:build
          docker compose -f tooling/docker/docker-compose.server-first.yml up -d --build --wait --wait-timeout 180
          AVA_DATABASE_URL=postgres://ava:ava@localhost:5433/ava_test bun run db:migrate

      - name: Kör Fortnox-E2E
        id: e2e
        env:
          AVA_FORTNOX_CLIENT_ID: ${{ secrets.AVA_FORTNOX_CLIENT_ID }}
          AVA_FORTNOX_CLIENT_SECRET: ${{ secrets.AVA_FORTNOX_CLIENT_SECRET }}
          AVA_FORTNOX_REFRESH_TOKEN: ${{ secrets.AVA_FORTNOX_REFRESH_TOKEN }}
          AVA_FORTNOX_VOUCHER_SERIES: ${{ vars.AVA_FORTNOX_VOUCHER_SERIES }}
          AVA_FORTNOX_KONTO_KUNDFORDRAN: ${{ vars.AVA_FORTNOX_KONTO_KUNDFORDRAN }}
          AVA_FORTNOX_KONTO_ARVODE: ${{ vars.AVA_FORTNOX_KONTO_ARVODE }}
          AVA_FORTNOX_KONTO_MOMS: ${{ vars.AVA_FORTNOX_KONTO_MOMS }}
          AVA_FORTNOX_BOOKING_WINDOW: ${{ vars.AVA_FORTNOX_BOOKING_WINDOW }}
          AVA_FORTNOX_ACCOUNT_TYPE: ${{ vars.AVA_FORTNOX_ACCOUNT_TYPE }}
          AVA_FORTNOX_DRY_RUN: ${{ steps.mode.outputs.dry_run == 'true' && '1' || '' }}
        run: bun tooling/scripts/fortnox-e2e.ts

      - name: Bokförings-E2E (två betalande → två verifikat)
        id: bookkeeping
        if: steps.mode.outputs.bookkeeping == 'true' && steps.mode.outputs.dry_run != 'true'
        env:
          AVA_FORTNOX_CLIENT_ID: ${{ secrets.AVA_FORTNOX_CLIENT_ID }}
          AVA_FORTNOX_CLIENT_SECRET: ${{ secrets.AVA_FORTNOX_CLIENT_SECRET }}
          AVA_FORTNOX_REFRESH_TOKEN: ${{ steps.e2e.outputs.refresh_token || secrets.AVA_FORTNOX_REFRESH_TOKEN }}
          AVA_FORTNOX_ACCOUNT_TYPE: ${{ vars.AVA_FORTNOX_ACCOUNT_TYPE }}
          AVA_FORTNOX_VOUCHER_SERIES: ${{ vars.AVA_FORTNOX_VOUCHER_SERIES }}
          AVA_FORTNOX_BOOKING_WINDOW: ${{ vars.AVA_FORTNOX_BOOKING_WINDOW }}
          AVA_FORTNOX_KONTO_KUNDFORDRAN: ${{ vars.AVA_FORTNOX_KONTO_KUNDFORDRAN }}
          AVA_FORTNOX_KONTO_ARVODE: ${{ vars.AVA_FORTNOX_KONTO_ARVODE }}
          AVA_FORTNOX_KONTO_MOMS: ${{ vars.AVA_FORTNOX_KONTO_MOMS }}
          SERVER_URL: http://localhost:3001
          AVA_DATABASE_URL: postgres://ava:ava@localhost:5433/ava_test
          AVA_ORGANIZATION_ID: "00000000-0000-0000-0000-000000000001"
        run: bun tooling/scripts/fortnox-bookkeeping-e2e.ts

      - name: Riv ner stacken
        if: always() && steps.mode.outputs.bookkeeping == 'true' && steps.mode.outputs.dry_run != 'true'
        run: docker compose -f tooling/docker/docker-compose.server-first.yml down -v

      # Måste köras även när e2e:t fallerade: token:en roterade i det FÖRSTA
      # anropet, så den gamla är död oavsett hur körningen slutade. Hoppar över
      # sig själv om scriptet inte hann emitta något (t.ex. saknad secret).
      - name: Spara roterad refresh-token
        if: always() && (steps.bookkeeping.outputs.refresh_token != '' || steps.e2e.outputs.refresh_token != '')
        env:
          GH_TOKEN: ${{ secrets.AVA_FORTNOX_ROTATE_PAT }}
          NEW_TOKEN: ${{ steps.bookkeeping.outputs.refresh_token || steps.e2e.outputs.refresh_token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AVA_FORTNOX_ROTATE_PAT saknas — den roterade token:en kan inte sparas."
            echo "::error::Nästa körning kommer att misslyckas. Uppdatera AVA_FORTNOX_REFRESH_TOKEN manuellt."
            exit 1
          fi
          # INTE `--body -`: gh har ingen "-"-konvention för --body (bara för
          # --env-file), så värdet hade lagrats literalt som "-" och nästa
          # körning dött i auth. Utan --body läser gh stdin.
          printf '%s' "$NEW_TOKEN" | gh secret set AVA_FORTNOX_REFRESH_TOKEN \
            --repo "${{ github.repository }}" --env fortnox-sandbox
          echo "✓ AVA_FORTNOX_REFRESH_TOKEN uppdaterad med den roterade token:en."
