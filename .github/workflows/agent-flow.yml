# Flödesvakten (docs/agent-flow.md): varje etikett som sätts på en issue/PR
# prövas mot tooling/agents/flow.yaml — otillåtna övergångar stoppas och det
# gamla tillståndet tas bort, så att varje sak har exakt ett. Varje timme körs
# klockan: timeouterna i flödet och CI som hänger.
#
# Läge: repovariabeln FLOW_GUARD_MODE (enforce | report, standard report).
# Samma vakt körs i ulrik-s/ava-feedback för intaget (dess egen workflow).
name: Flödesvakt

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [labeled]
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      normalize:
        description: "Städa en maskin till ett tillstånd per sak (code-issue eller code-pr); tomt = kör klockan"
        required: false
        default: ""

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: flow-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  FLOW_GUARD_MODE: ${{ vars.FLOW_GUARD_MODE || 'report' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  guard:
    name: Flödesvakt (etikett)
    if: github.event_name == 'issues' || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Alltid vakten på main — aldrig en PR:s egen (möjligen ändrade) version.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun tooling/scripts/flow-guard.ts
        env:
          # Händelsestyrningen: startar tillståndets agent direkt. Saknas en
          # hemlighet tar rutinen saken vid sin nästa schemalagda körning.
          ROUTINE_TOKEN_L3: ${{ secrets.ROUTINE_TOKEN_L3 }}
          ROUTINE_TOKEN_L4: ${{ secrets.ROUTINE_TOKEN_L4 }}

  clock:
    name: Flödesvakt (klocka)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - env:
          NORMALIZE: ${{ github.event.inputs.normalize }}
          # Knuffen startar agenten igen för saker som stått still (flow.yaml: nudge).
          ROUTINE_TOKEN_L3: ${{ secrets.ROUTINE_TOKEN_L3 }}
          ROUTINE_TOKEN_L4: ${{ secrets.ROUTINE_TOKEN_L4 }}
        run: |
          if [ -n "$NORMALIZE" ]; then
            bun tooling/scripts/flow-guard.ts normalize "$NORMALIZE"
          else
            bun tooling/scripts/flow-watchdog.ts code-issue code-pr --ci
          fi

  # Den automatiska taggen (flow.yaml: release): högst en per period, bara med
  # ändringar och grön CI på main. Stoppa med repovariabeln AUTO_RELEASE=off.
  release:
    name: Flödesvakt (automatisk tagg)
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event.inputs.normalize == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # skapa taggen
      actions: write # starta release.yml på taggen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - env:
          AUTO_RELEASE: ${{ vars.AUTO_RELEASE }}
        run: bun tooling/scripts/flow-release.ts

  # Svar i kommentarer (användaren från AVA, eller Ulrik på något blockerat)
  # startar rätt agent direkt — rutinernas egna GitHub-händelser täcker inte kommentarer.
  comment:
    name: Flödesvakt (svar)
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun tooling/scripts/flow-comment.ts
        env:
          ROUTINE_TOKEN_L3: ${{ secrets.ROUTINE_TOKEN_L3 }}
          ROUTINE_TOKEN_L4: ${{ secrets.ROUTINE_TOKEN_L4 }}
