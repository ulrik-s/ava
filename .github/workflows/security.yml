name: Security

# Säkerhetsscanning (#909): statisk analys (CodeQL/SAST) på push/PR/veckoschema.
# Kompletterar Dependabot (som bumpar) med SAST på koden.
#
# OBS: kräver att "CodeQL default setup" är AVSTÄNGT i repo-inställningarna
# (annars krockar detta advanced-workflow med default-setupen).
#
# `dependency-review` (GitHubs license-/CVE-grind på nya deps i en PR) är INTE
# möjlig här: API:et kräver GitHub Advanced Security på privata repon, och svarar
# annars "Dependency review is not supported on this repository" även med
# Dependency graph påslagen (verifierat i #915/PR #964).
#
# `bun audit` ger CVE-täckningen utan GHAS och mot samma beroendeträd som vi
# faktiskt installerar. Licensgrinden (GPL/AGPL) saknar substitut — se #915.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # måndag 03:00 UTC — fångar nya CVE:er i orörd kod

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── CodeQL (SAST) ──────────────────────────────────────────────────────────
  codeql:
    name: CodeQL (JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # ladda upp SARIF till Security-fliken
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initiera CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          build-mode: none # ren JS/TS → ingen kompilering behövs
          queries: security-and-quality
      - name: Analysera
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:javascript-typescript"

  # ── Sårbara beroenden (CVE-grind) ─────────────────────────────────────────
  # `bun audit` mot samma beroendeträd CI installerar. RATCHET (docs/quality.md):
  # nivån dras BARA åt.
  #
  # 2026-08-09 (#966): nivån skärptes `critical` → `moderate` sedan 27 av 30
  # kända sårbarheter arbetats bort via `overrides` i package.json.
  # 2026-08-09 (#970): `moderate` → `low` sedan `html-to-docx` ersatts av en egen
  # DOCX-skrivare. Grinden fäller nu på VARJE ny sårbarhet, oavsett allvarsgrad,
  # i båda arbetsytorna.
  #
  # Undantagen nedan är namngivna per advisory, inte en uppmjukad nivå. Var och en
  # kräver en rad med skäl; utan skäl ska raden bort och sårbarheten åtgärdas.
  # Samma regel gäller båda arbetsytorna (roten och `helper-ui`): undantag bara
  # per advisory, med skäl och ett uppföljningsärende.
  audit:
    name: Sårbara beroenden (bun audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/bun-setup

      # esbuild (moderate): esbuild@0.18.20 låst av det AVSOMNADE
      #   @esbuild-kit/core-utils (`~0.18.20`) via drizzle-kit, vars senaste
      #   version fortfarande drar in det. Advisoryn gäller esbuilds
      #   UTVECKLINGSSERVER, som vi aldrig startar; paketet är dessutom devDep.
      #
      # (De två image-size-undantagen är BORTA sedan #970 — html-to-docx är
      # ersatt av en egen DOCX-skrivare, så paketet finns inte längre i trädet.
      # braces GHSA-vfj7-8cjw-p6xm och sprintf-js GHSA-hp3w-g68c-fv3c är
      # TILLBAKADRAGNA av GitHub och undantogs inte längre sedan #1473.)
      # minimatch (moderate, GHSA-g3hv-75wg-m249, 2026-10-28): DoS via
      #   globparts-amplifiering. Rättad i 11.0.1, men ingen konsument tar 11.x
      #   ännu: eslint → @eslint/config-array (^10.2.4) och eslint-config-next →
      #   typescript-eslint → typescript-estree (^10.2.2). En global override
      #   går inte — 11 saknar den anropsbara default-exporten som trädets
      #   minimatch@3-konsumenter (eslint-plugin-react/-jsx-a11y/-import) kallar,
      #   och bun 1.3.14 saknar versions-scopade overrides. Bara lint på våra
      #   egna mönster, aldrig i server/klient. Tas bort i #1475.
      - name: bun audit (roten)
        run: |
          bun audit --audit-level=low \
            --ignore GHSA-67mh-4wv8-2f99 \
            --ignore GHSA-g3hv-75wg-m249

      # helper-ui har egen lockfil och låg helt UTANFÖR grinden fram till #966 —
      # den innehöll då 27 sårbarheter, varav en critical (node-tar).
      - name: Installera helper-ui (frozen)
        run: bun install --frozen-lockfile
        working-directory: helper-ui

      # (node-forge, GHSA-86w9-cpqp-85rv, åtgärdades i stället för att undantas:
      # cert-bygget i src/engine/tls/certs.ts använder nu @peculiar/asn1-x509 +
      # node:crypto, så paketet finns inte längre i trädet.)
      # (http-cache-semantics GHSA-ch52-4w7c-c8xp och sprintf-js
      # GHSA-hp3w-g68c-fv3c är TILLBAKADRAGNA av GitHub och undantogs inte
      # längre sedan #1473.)
      # minimatch (moderate, GHSA-g3hv-75wg-m249, 2026-10-28): samma advisory som
      #   i roten. Rättad i 11.0.1, men electron-builder → app-builder-lib
      #   deklarerar ^10.2.5 och @electron/asar ^3.0.4 (anropar default-exporten
      #   som 11 saknar → global override bryter paketeringen). Bara i
      #   BYGG-kedjan (devDeps, paketeras inte i appen). Tas bort i #1475.
      - name: bun audit (helper-ui)
        run: |
          bun audit --audit-level=low \
            --ignore GHSA-g3hv-75wg-m249
        working-directory: helper-ui

      - name: Full rapport (informativ, fäller inte)
        if: always()
        run: |
          echo "── roten ──";     bun audit || true
          echo "── helper-ui ──"; (cd helper-ui && bun audit) || true
