name: Release (full package)

# Tag-triggad release av HELA paketet (#87): web (statisk demo-export) +
# auto-genererade release-noter.
#
# Tagga `vX.Y.Z` → bygg alla artefakter → en GitHub-release med allt bifogat.
# `workflow_dispatch` på en gren kör en DRY-RUN (bygger allt, publicerar
# INGET). På en `v*`-tagg publicerar den — så startar flödesvaktens
# automatiska tagg releasen (en tagg skapad med repots token startar inte
# workflows av sig själv; tooling/scripts/flow-release.ts).
#
# Helper-paketeringen är medvetet UTELÄMNAD här: helpern är numera EN
# Electron-app (ADR 0030, ingen fristående Bun-binär) som byggs/signeras med
# electron-builder. Osignerad i nuläget (inget cert, #110) och kan inte
# headless-byggas i CI → packas + släpps separat när cert finns. Office-
# add-ins läggs till som ett eget bygg-/upload-steg när #83/#84 finns.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Least-privilege (#909): default läs; bara release-jobbet får skriva (release).
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ─── Web (statisk demo-export) — samma bygge som deploy-demo.yml ──────────
  web:
    name: Build web demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # DRY toolchain (Node 24 + pinnad Bun + cachead frozen install), #909.
      - uses: ./.github/actions/bun-setup
      - name: Build demo (app + seeded data)
        env:
          DEMO_BUILD: "1"
          NEXT_PUBLIC_DEMO_BUILD: "1"
        run: bun run build:demo
      - name: Zip static export
        run: |
          cd out
          zip -r "../ava-web-demo_${{ github.ref_name }}.zip" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-demo
          path: ava-web-demo_*.zip
          if-no-files-found: error

  # TODO (#83/#84): lägg till ett `office-addins`-jobb här när add-ins finns —
  # bygg Outlook/Word-paketen och ladda upp som artefakt `office-addins`,
  # samt lägg dem i `release`-jobbets `needs` + `files`.

  # ─── Samla artefakter → GitHub-release (endast på riktig tag) ─────────────
  release:
    name: Publish GitHub release
    needs: [web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # skapa release + ladda upp artefakter
      pull-requests: read # PR:ernas rad "För användarna" (Nytt i AVA, #2010)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # taggarna och historiken mellan dem, för Nytt i AVA
      - uses: ./.github/actions/bun-setup
      # Releasens text: den fasta beskrivningen och sist "## Nytt i AVA" (#2010),
      # som AVA visar för juristerna. Sist, så att GitHubs "## What's Changed"
      # avslutar avsnittet. Går nyheterna inte att samla släpps releasen ändå.
      - name: Releasens text med Nytt i AVA
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > body.md <<'EOF'
          AVA TAGG — hela paketet.

          - **Web** — statisk demo-export (`ava-web-demo_*.zip`); live-demo deployas
            löpande via deploy-demo.yml.

          Helper-appen (Electron, ADR 0030) släpps separat med electron-builder
          när signeringscert finns (#110). Office-add-ins läggs till när #83/#84
          finns. Artefakter är osignerade i denna version.

          EOF
          sed -i "s/^AVA TAGG/AVA ${TAG}/" body.md
          bun tooling/scripts/release-user-notes.ts "$TAG" >> body.md || echo "::warning::Nytt i AVA kunde inte samlas"
          cat body.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-demo
          # Med name: läggs filerna direkt i path, utan extra katalog — samma
          # layout oavsett action-version (v8 lade dem inte där v7 gjorde).
          path: artifacts/web-demo
      - run: ls -laR artifacts
      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/web-demo/*
          body_path: body.md
