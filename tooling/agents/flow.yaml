# Agentkedjans flöde — den ENDA källan till tillstånd, etiketter, övergångar,
# villkor och timeouter. Redigera här och kör `bun run flow:gen`; det skriver
# om tooling/agents/labels.json och docs/agent-flow.md (diagrammet).
# Testerna fäller om de genererade filerna inte stämmer med den här filen.
#
# Begrepp:
#   tillstånd  En etikett som säger var saken står. EXAKT ett åt gången:
#              flödesvakten tar bort det gamla när ett nytt sätts.
#              `label: null` = start (ingen tillståndsetikett).
#   flagga     En etikett som läggs ovanpå tillståndet, t.ex. en paus
#              (`blockerad`, `väntar-på-användaren`) eller en typ (`bugg`).
#   by         Vem som får göra övergången: `any` (agenter och Ulrik) eller
#              `ulrik` (bara Ulrik själv, kontrolleras i händelseloggen: inget
#              GitHub-app-märke). Ulrik får alltid göra alla övergångar, utom
#              dem tillståndet nekar med `refuse`.
#   refuse     Mål som nekas från tillståndet för ALLA, även Ulrik. Vakten tar
#              bort etiketten och kommenterar `comment` (varför, och vad man
#              gör i stället).
#   timeout    Flödesvaktens klocka (varje timme): så länge får en sak stå i
#              tillståndet/flaggan innan vakten gör något själv.
#   agent      Rutinen som arbetar med saken i det tillståndet. Flödesvakten
#              startar den direkt när saken går in i tillståndet (via
#              rutinens API-token), om inte `dispatch: false` — för tillstånd
#              som agenten själv sätter mitt i sitt arbete.
#   wait_for_blockers
#              Agenten startas inte så länge saken har öppna GitHub-beroenden
#              (blocked by, speglade ur `Beror på #N`); den startas när den
#              sista blockeraren stängs. Se docs/feedback-pipeline.md.

version: 1
ulrik: ulrik-s

machines:
  intake:
    repo: ulrik-s/ava-feedback
    items: issues
    description: En förfrågan från knappen i AVA.
    start: mottagen
    states:
      mottagen:
        label: null
        description: Ny eller återställd för omverifiering.
        agent: L1
        transitions:
          - to: undersokt
          - to: dubblett
          - to: finns-redan
          # Flera orelaterade saker i samma förfrågan: delad i egna förfrågningar.
          - to: uppdelad
      undersokt:
        label: undersökt
        color: "c5def5"
        description: Verifieringsagenten har undersökt och skrivit sin rapport — väntar på Ulrik
        agent: null
        transitions:
          - to: verifierad
            by: ulrik
          # Omverifiering (Ulrik eller en dubblett tog bort undersökt) kan sluta som dubblett.
          - to: dubblett
          # …eller med att användaren fick hjälp att hitta det som redan fanns.
          - to: finns-redan
      verifierad:
        label: verifierad
        color: "1d76db"
        description: ULRIKS beslut (satt för hand) — sant och värt att bygga; nedbrytningen får ta den
        agent: L2
        transitions:
          - to: nedbruten
          # Designvägen (storlek M/L, nytt mönster eller riskområde): loop 2
          # designar först, loop 3 granskar, sedan bryts den ner enligt designen.
          - to: designas
      designas:
        label: designas
        color: "c5def5"
        description: Loop 2 designar lösningen; frågor till användaren eller Ulrik (högst 2 rundor)
        agent: L2
        transitions:
          - to: design-granskas
      design-granskas:
        label: design-granskas
        color: "fbca04"
        description: Loop 3 granskar designen mot ADR:erna innan den bryts ner
        agent: L3
        transitions:
          - to: design-godkand
          - to: designas
      design-godkand:
        label: design-godkänd
        color: "0e8a16"
        description: Designen är godkänd utan öppna frågor; loop 2 bryter ner den enligt designen
        agent: L2
        transitions:
          - to: nedbruten
      nedbruten:
        label: nedbruten
        color: "5319e7"
        description: Nedbruten i implementations-issues i ava
        agent: L2
        dispatch: false
        transitions:
          - to: levererad
        # Ulrik satte verifierad på fem nedbrutna av misstag (#1667): det tog bort
        # nedbruten och startade loop 2 i onödan.
        refuse:
          to: [verifierad]
          comment: Förfrågan är redan nedbruten i uppgifter, så `verifierad` behövs inte och gör ingenting. Den når användarna med nästa release.
      levererad:
        label: levererad
        color: "0e8a16"
        description: Levererad i produktion (se release:-etiketten); stängs av en Action
        agent: null
        transitions: []
        refuse:
          to: [verifierad]
          comment: Förfrågan är redan levererad. Behöver användaren något mer skickar hen en ny förfrågan.
      finns-redan:
        label: finns-redan
        color: "bfdadc"
        description: Fanns redan (eller avsett beteende); användaren har fått veta hur — stängs av en Action
        # Slutläge: användaren har bekräftat (eller inte svarat på 7 dagar). Behöver
        # hen något mer skickar hen en ny förfrågan.
        agent: null
        transitions: []
      dubblett:
        label: dubblett
        color: "cfd3d7"
        description: Samma sak som en äldre förfrågan; följer originalet
        agent: L2
        transitions:
          - to: levererad
      uppdelad:
        label: uppdelad
        color: "d4c5f9"
        description: Innehöll flera olika saker; delad i egna förfrågningar (Del av #N) och stängd av en Action
        # Delarna lever vidare som egna förfrågningar; originalet är klart.
        agent: null
        transitions: []
    flags:
      user-request:
        color: "0e8a16"
        description: Från knappen i AVA — användarens egen text
      bugg:
        color: "d73a4a"
        description: Användaren rapporterar ett fel
      förslag:
        color: "a2eeef"
        description: Användaren föreslår en förbättring
      ej-bekräftad:
        color: "e99695"
        description: Verifieringsagenten kunde inte bekräfta buggen/behovet
      väntar-på-användaren:
        color: "fbca04"
        description: En fråga till användaren (i AVA) väntar på svar
        timeout:
          after: 7d
          comment: Användaren har inte svarat på 7 dagar. Flödesvakten tog bort väntar-på-användaren; agenten går vidare utan svaret.
      blockerad:
        color: "b60205"
        description: Agenten behöver ett beslut av Ulrik
      agentstatus:
        color: "0e8a16"
        description: Statussidan för agentkedjan (uppdateras av flödesvakten)
      # Prioritet: loop 1 sätter en enligt regeln i 1-verifiering.md, Ulrik kan
      # byta. Statussidan sorterar efter den, och loop 2 och 4 tar högst först.
      # Ordningen här är prioritetsordningen.
      prio-hög:
        color: "d93f0b"
        description: Kan ge fel belopp, förlorad data, en säkerhetsrisk eller stoppa en användare
      prio-medel:
        color: "fbca04"
        description: Märks för användarna eller bromsar arbetet, men det finns en väg runt
      prio-låg:
        color: "c2e0c6"
        description: Internt städ, verktyg och utvecklartakt
      # Rekommendationen: loop 1 sätter en (1-verifiering.md, "Rekommendation")
      # tillsammans med undersökt, och den syns på tavlan. auto-godkänn: en
      # liten bekräftad bugg eller ett internt verktyg utan risk. Tavlans synk
      # sätter verifierad med Ulriks token efter 24 h om han inte lagt in veto
      # (flyttat kortet till Att besluta, som tar bort flaggan).
      rek-godkänn:
        color: "0e8a16"
        description: Loop 1 rekommenderar att den byggs
      rek-avböj:
        color: "b60205"
        description: Loop 1 rekommenderar att den inte byggs
      rek-fråga:
        color: "fbca04"
        description: Loop 1 — Ulrik behöver avgöra något först
      auto-godkänn:
        color: "5319e7"
        description: Liten bekräftad bugg eller internt verktyg utan risk — godkänns efter 24 h utan veto
      # Inkorgen för allt arbete: förfrågningar från Ulrik eller en agent. Loop 1
      # verifierar dem som andra, men det finns ingen användare att fråga.
      intern:
        color: "6e7781"
        description: Internt arbete (Ulrik eller en agent) — ingen användare att fråga
        # Sätts av Ulrik eller av klockan med hans token (flytten från ava), aldrig
        # av en agent: agenternas förhandsgodkända skrivningar ändras inte.
        by: ulrik

  code-issue:
    repo: ulrik-s/ava
    items: issues
    description: En implementations-issue (eller ett refaktoriseringsförslag) i ava.
    start: ny
    states:
      ny:
        label: null
        description: Utan granskningstillstånd. Utan arbetsorder-flagga flyttas den till inkorgen av klockan.
        agent: null
        transitions:
          - to: att-granska
          - to: granskad
            by: ulrik
      att-granska:
        label: att-granska
        color: "fbca04"
        description: Väntar på granskningsloopen
        agent: L3
        transitions:
          - to: granskad
            unless_flag: refaktorisering
          - to: behover-andras
      behover-andras:
        label: behöver-ändras
        color: "d93f0b"
        description: Granskningen begär ändringar
        agent: L3
        transitions:
          - to: att-granska
      granskad:
        label: granskad
        color: "0e8a16"
        description: Godkänd av granskningsloopen
        agent: L4
        wait_for_blockers: true
        transitions:
          - to: pagar
          - to: att-granska
      pagar:
        label: pågår
        color: "c5def5"
        description: Implementationsloopen arbetar på den (tills PR:en mergas)
        agent: L4
        dispatch: false
        transitions:
          - to: granskad
          - to: att-granska
        timeout:
          after: 4h
          to: granskad
          unless: open_pr
          comment: Ingen öppen PR efter 4 timmar i pågår. Flödesvakten lade tillbaka issuen i kön (granskad).
    flags:
      agent-task:
        color: "5319e7"
        description: Implementations-issue skapad av nedbrytningsloopen
      refaktorisering:
        color: "bfd4f2"
        description: Förslag från arkitekturgenomgången — byggs först när Ulrik satt granskad
      arkitektur-rapport:
        color: "0052cc"
        description: Veckans arkitekturgenomgång (loop 5)
      blockerad:
        color: "b60205"
        description: Agenten behöver ett beslut av Ulrik
      # Effektiv prioritet, satt av klockan: den egna (raden `Prioritet:` som
      # loop 2 skriver) eller den högsta bland det som väntar på issuen
      # (beroendena), om den är högre. Loop 4 tar högst först. Agenter sätter
      # dem inte. Ordningen här är prioritetsordningen.
      prio-hög:
        color: "d93f0b"
        description: Effektiv prioritet hög (egen eller ärvd från det som väntar på den)
        by: ulrik
      prio-medel:
        color: "fbca04"
        description: Effektiv prioritet medel (egen eller ärvd från det som väntar på den)
        by: ulrik
      prio-låg:
        color: "c2e0c6"
        description: Effektiv prioritet låg (egen eller ärvd från det som väntar på den)
        by: ulrik

  code-pr:
    repo: ulrik-s/ava
    items: pulls
    description: En PR i ava — agentens egen, Dependabots eller Ulriks.
    start: ny
    states:
      ny:
        label: null
        description: Nyöppnad, inget granskningstillstånd ännu.
        agent: L6
        transitions:
          - to: att-granska
          - to: granskad
          - to: behover-andras
      att-granska:
        label: att-granska
        color: "fbca04"
        description: Väntar på granskningsloopen
        agent: L3
        transitions:
          - to: granskad
          - to: behover-andras
      behover-andras:
        label: behöver-ändras
        color: "d93f0b"
        description: Granskningen begär ändringar
        agent: L4
        transitions:
          - to: att-granska
          - to: granskad
      granskad:
        label: granskad
        color: "0e8a16"
        description: Godkänd av granskningsloopen
        agent: L3
        transitions:
          - to: att-granska
          - to: behover-andras
    flags:
      agent-pr:
        color: "5319e7"
        description: PR skapad av implementationsloopen
      människa-godkänd:
        color: "000000"
        description: Ulrik tillåter att agent-PR:en rör skyddade sökvägar/migrationer
        by: ulrik
      blockerad:
        color: "b60205"
        description: Agenten behöver ett beslut av Ulrik

# Rutinerna. De startas av flödesvakten när en sak går in i ett tillstånd
# med deras agent (kräver hemligheten ROUTINE_TOKEN_<id> i repot), av
# GitHub-händelser under `events`, och av sitt schema som reserv.
routines:
  L1:
    name: AVA - 1 - Verification - User Feedback
    prompt: tooling/agents/1-verifiering.md
    trigger_id: trig_01Pt8BjCQCZPnje4DXrTx4QU
    events:
      - "GitHub: ava-feedback issues.opened"
      - "flödesvakten: användarens svar i AVA"
  L2:
    name: AVA - 2 - Breakdown - User Feedback
    prompt: tooling/agents/2-nedbrytning.md
    trigger_id: trig_01TnVuo291SKkYqn3f8752qn
    events:
      - "GitHub: ava release.published"
  L3:
    name: AVA - 3 - Review - User Feedback
    prompt: tooling/agents/3-granskning.md
    trigger_id: trig_01Uojap85XQbybQMenuaVf1F
    events: []
  L4:
    name: AVA - 4 - Implementation - User Feedback
    prompt: tooling/agents/4-implementation.md
    trigger_id: trig_019KfqBDJkYMiLG43Dr7QMo2
    events: []
  L5:
    name: AVA - 5 - Architecture - Weekly
    prompt: tooling/agents/5-arkitektur.md
    trigger_id: trig_01TAQW7uZ8sTom38Rsr4HTbg
    events: []
  L6:
    name: AVA - 6 - PR-vakt
    prompt: tooling/agents/6-pr-vakt.md
    trigger_id: trig_013of5P8fniW3JfmVty3gnJH
    events: []

ci:
  hang_minutes: 60

# Knuffen: står en sak längre än så här i ett tillstånd med en agent, startar
# klockan agenten igen (en gång per period). Saker som väntar på en människa
# (flaggorna nedan) knuffas inte.
nudge:
  after: 2h
  skip_flags:
    - blockerad
    - väntar-på-användaren

# Hälsokontrollen (statussidan "Agentkedjans status" i ava-feedback): en sak
# som stått så här länge i ett agenttillstånd trots knuffar larmar, med push.
health:
  stuck_after: 6h

# Automatisk tagg: högst en per period, när main har ändringar av de här
# typerna sedan senaste taggen och CI är grön. Stoppas med repovariabeln
# AUTO_RELEASE=off i ulrik-s/ava. Var 6:e timme (#1776): det som är byggt ska
# inte vänta ett dygn på att nå användarna, och en trasig release backas nu
# automatiskt (#1770).
release:
  every: 6h
  types:
    - feat
    - fix
    - refactor
    - perf
