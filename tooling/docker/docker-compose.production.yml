# PRODUKTIONS-STACK för self-hosted AVA (#1079) — server-first + OIDC + TLS.
#
# Skillnaden mot `docker-compose.selfhosted-local.yml`, som är en TESTRIGG:
#
#   testriggen                        den här
#   ─────────────────────────────     ────────────────────────────────────
#   Postgres på tmpfs (data borta      namngiven volym som överlever
#     vid omstart)                       omstart och uppgradering
#   Keycloak start-dev, admin/admin    byråns EGEN IdP via OIDC-discovery
#   http på :8080                      TLS via Caddy (automatiskt cert)
#   ingen omstartspolicy               restart: unless-stopped + autoheal
#   attrapp-healthcheck i nginx        /readyz som faktiskt rör databasen
#
#   docker compose -f tooling/docker/docker-compose.production.yml up -d
#
# Kräver en ifylld `ava-server.env` (se docs/deploy-server-first.md).
#
# Images låsta till digest (#1881): varje `image:` (och server-first-
# Dockerfilens `FROM` och `# syntax=`) har formen `namn:tagg@sha256:…`, där
# digesten är manifestlistans, så amd64 och arm64 båda fungerar. Taggen är bara
# en läsbar etikett: docker hämtar det digesten säger. En digest byts med en
# vanlig PR (`docker buildx imagetools inspect namn:tagg`, raden `Digest:`), och
# nästa deploy hämtar den nya imagen. Postgres byter aldrig major med bara en
# ny tagg: se Uppgradering i docs/deploy-server-first.md.

name: ava

services:
  # ─── TLS-terminering + statisk app ────────────────────────────────────
  # Caddy i st.f. nginx HÄR (bara här): den skaffar och förnyar Let's
  # Encrypt-cert själv. En byrå ska inte behöva sköta certbot-cron för att
  # köra sitt ärendesystem, och ett utgånget cert är ett driftstopp.
  caddy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      AVA_DOMAIN: "${AVA_DOMAIN:?AVA_DOMAIN krävs (t.ex. ava.byra.se)}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # HELA releases/ (inte en enskild release, inte out/): Caddyfile har
      # `root /srv/releases/current`, en relativ symlänk som följs vid varje
      # request. Ett klientbyte i deploy-prod.sh är då ett atomärt rename av
      # länken — ingen omstart. En bind-mount av out/ pekade på katalogens
      # inode, som `next build` ersätter: 404 under bygget (#1369).
      - ../../releases:/srv/releases:ro
      - caddy_data:/data
      - caddy_config:/config
    # Nät (#1879): bara `edge` — Caddy når oauth2-proxy och server-first, men
    # inte databasen.
    networks:
      - edge
    depends_on:
      oauth2-proxy:
        condition: service_started
      server-first:
        condition: service_healthy

  # ─── OIDC relying party mot byråns egen IdP ───────────────────────────
  # Ingen inbyggd IdP. Entra, Google eller vad byrån redan har — samma
  # mönster som docker-compose.oidc-byoidp.yml, se docs/self-hosted-entra.md.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0@sha256:dcb6ff8dd21bf3058f6a22c6fa385fa5b897a9cd3914c88a2cc2bb0a85f8065d
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_PROVIDER: "${OIDC_PROVIDER:-oidc}"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:?OIDC_ISSUER_URL krävs}"
      OAUTH2_PROXY_CLIENT_ID: "${OAUTH2_PROXY_CLIENT_ID:?OAUTH2_PROXY_CLIENT_ID krävs}"
      OAUTH2_PROXY_CLIENT_SECRET: "${OAUTH2_PROXY_CLIENT_SECRET:?OAUTH2_PROXY_CLIENT_SECRET krävs}"
      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_PROXY_COOKIE_SECRET:?OAUTH2_PROXY_COOKIE_SECRET krävs}"
      OAUTH2_PROXY_EMAIL_DOMAINS: "${OIDC_EMAIL_DOMAINS:-*}"
      # Sessionen förnyas (#1351). ID-token från Entra gäller en timme; utan
      # förnyelse skickade proxyn en utgången token till servern (401 med fel
      # besked) och sessionen dog efter en timme. Proxyn förnyar med
      # refresh-token vid första anropet efter COOKIE_REFRESH — innan den
      # validerar — så den token servern får har alltid >= 30 min kvar. Ett
      # misslyckat försök (IdP:n nere) behåller sessionen tills token går ut.
      # Krav: COOKIE_REFRESH < COOKIE_EXPIRE (proxyn vägrar annars starta) och
      # < ID-tokenets livstid. COOKIE_EXPIRE = klientens offline-grace (7 dygn).
      # Entra ger refresh-token bara med `offline_access` i scope — Google
      # (provider oidc) godtar inte det scopet: sätt OIDC_SCOPE utan det.
      OAUTH2_PROXY_SCOPE: "${OIDC_SCOPE:-openid email profile offline_access}"
      OAUTH2_PROXY_COOKIE_REFRESH: "${OAUTH2_PROXY_COOKIE_REFRESH:-30m}"
      OAUTH2_PROXY_COOKIE_EXPIRE: "${OAUTH2_PROXY_COOKIE_EXPIRE:-168h}"
      OAUTH2_PROXY_REDIRECT_URL: "https://${AVA_DOMAIN}/oauth2/callback"
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      # Cookien får bara gå över TLS här — testriggen kör http och kan inte.
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      # #1256: ID-token i auth-svaret (`Authorization: Bearer`), som Caddy
      # skickar vidare som X-Ava-Identity-Token → servern kan verifiera
      # identiteten själv (AVA_IDENTITY=verified) i stället för att lita på
      # X-Auth-Request-Email.
      OAUTH2_PROXY_SET_AUTHORIZATION_HEADER: "true"
      # AVA Helper (ADR 0028) kör utanför browsern och har ingen session-cookie:
      # den skickar sin EGEN Entra-access-token som `Authorization: Bearer`.
      # "true" → oauth2-proxy verifierar token (signatur mot IdP:ns JWKS, issuer,
      # `aud` = klient-id ovan) och sätter X-Auth-Request-Email ur dess `email`-
      # claim — samma verifierade principal som cookie-vägen, ingen ny förtroende-
      # väg förbi Caddy. OPT-IN: kräver Entra-konfigen i docs/self-hosted-entra.md
      # (exponerat API + email i access-token). Av som default.
      OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS: "${AVA_HELPER_ENABLED:-false}"
    networks:
      - edge

  # ─── Postgres: byråns akter ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ava}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD krävs}"
      POSTGRES_DB: "${POSTGRES_DB:-ava}"
    # NAMNGIVEN VOLYM, inte tmpfs. Testriggen kastar data vid omstart med
    # flit; här ÄR den byråns akter.
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Ingen host-port, och bara nätet `default` (#1879): databasen nås av
    # server-first, inte av Caddy, oauth2-proxy eller ollama. Backup går via
    # `docker compose exec`, se tooling/scripts/backup-db.sh.
    #
    # `default` (= `ava_default`) behålls med flit: deploy-prod.sh kör
    # migreringen med `docker run --network ava_default` innan `dc up`, och
    # `avarun` i installationen (docs/deploy-server-first.md) går på samma nät.
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ava} -d ${POSTGRES_DB:-ava}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── AVA:s server-first-runtime ───────────────────────────────────────
  server-first:
    build:
      context: ../..
      dockerfile: tooling/docker/server-first/Dockerfile
    restart: unless-stopped
    environment:
      AVA_DATABASE_URL: "postgres://${POSTGRES_USER:-ava}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ava}"
      AVA_ORGANIZATION_ID: "${AVA_ORGANIZATION_ID:?AVA_ORGANIZATION_ID krävs}"
      AVA_HTTP_HOST: 0.0.0.0
      AVA_HTTP_PORT: "3001"
      # Identitet (#1256, #1880): prod-stacken kör "verified" som standard —
      # servern godtar bara en signerad token (proxyns ID-token eller helperns
      # Bearer), verifierad mot IdP:ns nycklar via OIDC-discovery, så en
      # förfalskad header ger ingenting. Kräver issuer och audience (nedan, ur
      # oauth2-proxys obligatoriska variabler) och att servern når IdP:n.
      # "forwarded" (kodens standard) litar på X-Auth-Request-Email och gäller
      # bara med AVA_IDENTITY=forwarded i ava-server.env, som reserv.
      # Se docs/deploy-server-first.md, "Identitet".
      AVA_IDENTITY: "${AVA_IDENTITY:-verified}"
      # Remote-MCP för Claude (#1026) — av när AVA_MCP_RESOURCE är tom.
      # Se docs/mcp-remote.md (Entra-appen, scopes, Claude-kopplingen).
      AVA_MCP_RESOURCE: "${AVA_MCP_RESOURCE:-}"
      AVA_MCP_ISSUER: "${AVA_MCP_ISSUER:-}"
      AVA_MCP_AUDIENCE: "${AVA_MCP_AUDIENCE:-}"
      AVA_MCP_SCOPES: "${AVA_MCP_SCOPES:-}"
      AVA_MCP_JWKS_URI: "${AVA_MCP_JWKS_URI:-}"
      AVA_IDENTITY_ISSUER: "${OIDC_ISSUER_URL:-}"
      AVA_IDENTITY_AUDIENCE: "${AVA_IDENTITY_AUDIENCE:-${OAUTH2_PROXY_CLIENT_ID:-}}"
      # Utloggning hos IdP:n (#1347): end_session_endpoint som klienten skickar
      # `/oauth2/sign_out?rd=` vidare till. Tomt = bara proxyns cookie tas bort.
      # Kräver att IdP:ns domän läggs i oauth2-proxys OAUTH2_PROXY_WHITELIST_DOMAINS,
      # se docs/auth.md "Lokal data, byte av användare och utloggning".
      AVA_OIDC_END_SESSION_URL: "${AVA_OIDC_END_SESSION_URL:-}"
      AVA_CONTENT_DIR: /data/content
      # "1" = inga mejl köas eller skickas (test-/pilotserver), se deploy-server-first.md.
      AVA_EMAIL_DISABLED: "${AVA_EMAIL_DISABLED:-}"
      # Dokumentklassificering med lokal LLM (#1156): tomt = filnamns-heuristik.
      # Med profilen "llm" (COMPOSE_PROFILES=llm): http://ollama:11434/v1 + modell.
      AVA_LLM_ENDPOINT: "${AVA_LLM_ENDPOINT:-}"
      AVA_LLM_MODEL: "${AVA_LLM_MODEL:-}"
      AVA_RELEASE: "${AVA_RELEASE:-}"
      # AVA Helper (ADR 0028/0029): webbappen hämtar helperns inloggnings-config
      # via `system.helperConfig` och pushar den till helpern. Tomt = av (default).
      # Sätts i ava-server.env när Entra är konfigurerat, se docs/self-hosted-entra.md.
      AVA_OIDC_ISSUER: "${AVA_HELPER_OIDC_ISSUER:-}"
      AVA_OIDC_CLIENT_ID: "${AVA_HELPER_OIDC_CLIENT_ID:-}"
      # Tomt AVA_HELPER_OIDC_AUDIENCE = helperns klient-id (Bearer-vägen kräver aud).
      AVA_OIDC_AUDIENCE: "${AVA_HELPER_OIDC_AUDIENCE:-${AVA_HELPER_OIDC_CLIENT_ID:-}}"
      # Entra: "api://<klient-id>/access_as_user openid email profile offline_access".
      AVA_OIDC_SCOPE: "${AVA_HELPER_OIDC_SCOPE:-}"
      # Entras JWKS ligger inte på Keycloak-vägen som är default (bearer-claims.ts).
      AVA_OIDC_JWKS_URI: "${AVA_HELPER_OIDC_JWKS_URI:-}"
      # Fortnox-bokföring (#1172): tomt = av. Tokens krypteras i valvet nedan
      # (AVA_SECRETS_KEY = base64 av 32 slumpbyte: `openssl rand -base64 32`).
      AVA_FORTNOX_CLIENT_ID: "${AVA_FORTNOX_CLIENT_ID:-}"
      AVA_FORTNOX_CLIENT_SECRET: "${AVA_FORTNOX_CLIENT_SECRET:-}"
      AVA_FORTNOX_REDIRECT_URI: "${AVA_FORTNOX_REDIRECT_URI:-https://${AVA_DOMAIN}/settings/fortnox}"
      AVA_SECRETS_KEY: "${AVA_SECRETS_KEY:-}"
      AVA_SECRETS_FILE: /data/secrets/vault.enc
      # Backup på begäran (#1431): "Ta backup nu" i Inställningar. Se volymerna nedan.
      AVA_BACKUP_EXPORT_DIR: /data/backup-exports
      AVA_BACKUP_REQUEST_DIR: /data/backup-requests
      # Buggar och förslag → det PRIVATA intag-repot (docs/feedback-pipeline.md).
      # Token med BARA Issues: write på det repot. Tomt = knappen syns inte.
      AVA_FEEDBACK_GITHUB_TOKEN: "${AVA_FEEDBACK_GITHUB_TOKEN:-}"
      AVA_FEEDBACK_REPO: "${AVA_FEEDBACK_REPO:-}"
    volumes:
      - content:/data/content
      # Eget volym: content är ett git-repo som kan speglas — hemligheter hör inte hemma där.
      - secrets:/data/secrets
      # Backup på begäran (#1431). Servern lägger en begäran här; hostens
      # ava-backup-request.path (tooling/systemd/, installeras av deploy-prod.sh)
      # startar då nattjobbets ava-backup.service. Containern får ingen docker-
      # eller host-åtkomst — den kan bara ändra en fil i den här katalogen.
      - ${AVA_BACKUP_REQUEST_HOST_DIR:-/srv/ava/backup-requests}:/data/backup-requests
      # De krypterade exporterna (backup-export.sh), READ-ONLY: läget och
      # nedladdningen. Servern har bara den publika nyckeln — den kan inte läsa dem.
      - ${AVA_BACKUP_EXPORT_HOST_DIR:-/srv/backup-chroot/ava}:/data/backup-exports:ro
    # Nät (#1879): `default` mot postgres, `edge` mot Caddy och `llm` mot ollama.
    # Servern är den enda tjänsten som når alla tre.
    networks:
      - default
      - edge
      - llm
    # /readyz rör DATABASEN (#1079). En attrapp som bara säger att processen
    # startat hade rapporterat frisk medan poolen var död — och då hade
    # autoheal nedan aldrig gjort något.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3001/readyz | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Omstart vid HÄNGNING ─────────────────────────────────────────────
  # `restart: unless-stopped` täcker bara krascher. En process som lever men
  # slutat svara startas ALDRIG om av docker — den är ju igång. Autoheal
  # bevakar healthcheck-statusen och startar om det som står som unhealthy.
  #
  # Därför måste healthchecken ovan vara ärlig: autoheal kan bara agera på
  # det den får veta.
  #
  # Inget nät alls (#1879): autoheal har docker-socketen och pratar bara med
  # den. På ett nät hade den som tar sig in här kunnat nå servern direkt.
  #
  # `latest` med digest (#1881): autoheal har ingen versionstagg nyare än
  # 1.2.0 (2021), så taggen säger ingen version, men digesten låser imagen.
  autoheal:
    image: willfarrell/autoheal:latest@sha256:aa7e65eef42543fa00770e1d36d1b44dd8869f160038c3ce423358dd7ac6d5f0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      # Vänta ut start_period innan något döms ohälsosamt.
      AUTOHEAL_START_PERIOD: "60"
      AUTOHEAL_INTERVAL: "15"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none

  # ─── Lokal LLM för dokumentklassificering (#1156) ─────────────────────
  # OPT-IN: COMPOSE_PROFILES=llm i ava-server.env. Ingen dokumenttext lämnar
  # servern. Ingen host-port, och bara nätet `llm` (#1879): server-first når
  # den, men den når varken databasen eller Caddy. Nätet är inte internal,
  # eftersom modellen laddas ner från nätet.
  # Laddar ner AVA_LLM_MODEL vid start (en gång; ligger sedan i volymen).
  # Liten modell med flit: servern har 2 vCPU och ingen GPU — qwen2.5:1.5b
  # klassificerade 6/7 testdokument på ~11 s (qwen2.5:3b: 6/7 på ~24 s).
  ollama:
    profiles: ["llm"]
    image: ollama/ollama:0.40.17@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'ollama serve & pid=$$!; sleep 3; ollama pull "$${AVA_LLM_MODEL}" || echo "modell-nedladdning misslyckades"; wait $$pid'
    environment:
      AVA_LLM_MODEL: "${AVA_LLM_MODEL:-qwen2.5:1.5b}"
      # Håll modellen laddad en timme efter senaste anropet (annars laddas den
      # om efter 5 min — märks som en extra fördröjning på nästa uppladdning).
      OLLAMA_KEEP_ALIVE: "1h"
    volumes:
      - ollama_models:/root/.ollama
    # Tak så en klassificering aldrig kan svälta databasen/appen på minne.
    mem_limit: 3g
    networks:
      - llm

# Egna nät (#1879), så att bara det som behöver nå varandra kan det. Inget är
# `internal: true`: Caddy hämtar cert, oauth2-proxy och servern når IdP:n,
# servern når Fortnox m.fl., och ollama hämtar modellen. `default` står inte
# här — det är compose-projektets eget nät (`ava_default`).
networks:
  edge:
  llm:

volumes:
  ollama_models:
  pgdata:
  content:
  secrets:
  caddy_data:
  caddy_config:
